<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up — NexaScale</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="logo" style="text-align:center;display:block;">NexaScale</a>
    <h1>Create your account</h1>
    <p class="sub">Free to start, no card needed</p>

    <form id="signupForm" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" placeholder="Your name" required>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@business.com" required>
        <div class="field-error" id="emailError">Enter a valid email address.</div>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 6 characters" required minlength="6">
        <div class="field-error" id="passwordError">Password must be at least 6 characters.</div>
      </div>
      <button type="submit" class="btn btn-gold btn-block">Create account</button>
      <div class="form-msg" id="formMsg"></div>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Log in</a>
    </div>
  </div>
</div>

<script src="auth-demo.js"></script>
<script>
NexaAuth.wireSignupForm({
  formId: 'signupForm',
  nameId: 'name',
  emailId: 'email',
  passwordId: 'password',
  emailErrorId: 'emailError',
  passwordErrorId: 'passwordError',
  msgId: 'formMsg',
  onSuccess: () => { window.location.href = 'dashboard.html'; }
});
</script>

</body>
</html>
